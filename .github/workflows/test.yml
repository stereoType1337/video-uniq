# CI only. Deployment is pull-based: the server deploys a commit once this job is green
# (deploy/autodeploy.sh + systemd timer), so GitHub holds no keys to the server.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uniq
          POSTGRES_PASSWORD: uniq
          POSTGRES_DB: uniq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uniq" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://uniq:uniq@localhost:5432/uniq_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: System tools (ffmpeg, fpcalc)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libchromaprint-tools
      - name: Install
        run: pip install -r requirements.txt -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check app tests
      - name: Types
        run: mypy app
      - name: Tests
        run: pytest -q

