services:
  bot:
    build: .
    container_name: video_uniq_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./work:/srv/work
    networks:
      - default
      - webapps_network

  worker:
    build: .
    container_name: video_uniq_worker
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.workers.worker"]
    depends_on:
      - db
      - redis
    volumes:
      - ./work:/srv/work
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  db:
    image: postgres:16-alpine
    container_name: video_uniq_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniq
      POSTGRES_PASSWORD: uniq
      POSTGRES_DB: uniq
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: video_uniq_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

networks:
  webapps_network:
    external: true
