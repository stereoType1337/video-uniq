services:
  bot:
    build: .
    container_name: video_uniq_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - redis
      - tg_api
    volumes:
      - ./work:/srv/work
    networks:
      - default
      - webapps_network

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.workers.worker"]
    depends_on:
      - db
      - redis
      - tg_api
    volumes:
      - ./work:/srv/work
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  tg_api:
    # Official Bot API server in local mode: 2 GB files, read straight from disk.
    image: aiogram/telegram-bot-api:10.4  # pinned; verified env vars TELEGRAM_API_ID/HASH/LOCAL
    container_name: video_uniq_tg_api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - ./work/tg:/var/lib/telegram-bot-api

  db:
    image: postgres:16-alpine
    container_name: video_uniq_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniq
      POSTGRES_PASSWORD: uniq
      POSTGRES_DB: uniq
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: video_uniq_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

networks:
  webapps_network:
    external: true
