# Copied to /opt/caddy/conf.d/video-uniq/ on deploy (SKILL.md §13).
# The bot webhook is NOT here: the local telegram-bot-api calls it over the internal network.
uniq.pulsemarket.eu {
    log {
        output file /var/log/caddy/video-uniq-access.log {
            roll_size 100mb
            roll_keep 5
        }
        format json
    }

    encode gzip

    header {
        X-Content-Type-Options "nosniff"
        X-Frame-Options "DENY"
        Referrer-Policy "strict-origin-when-cross-origin"
        -Server
    }

    handle /health {
        reverse_proxy video_uniq_bot:8080
    }

    # Public legal pages, rendered by the bot (app/web/legal.py)
    @legal path /terms /privacy /pay/success /pay/fail
    handle @legal {
        reverse_proxy video_uniq_bot:8080
    }

    # Payment provider callbacks (Kassa AI, Platega)
    handle /payments/* {
        reverse_proxy video_uniq_bot:8080 {
            header_up X-Real-IP {remote_host}
        }
    }

    # Stage 4: REST API and web cabinet go here.

    handle {
        respond "video-uniq" 200
    }
}
