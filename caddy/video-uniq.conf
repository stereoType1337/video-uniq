bot.video-uniq.example.com {
    log {
        output file /var/log/caddy/video-uniq-bot-access.log {
            roll_size 100mb
            roll_keep 5
        }
        format json
    }

    handle /api/* {
        reverse_proxy video_uniq_bot:8081 {
            header_up Host {host}
            header_up X-Real-IP {remote_host}
        }
    }

    handle /health {
        respond "OK" 200
    }

    handle {
        respond "Not Found" 404
    }
}
